syntax = "proto3";

package common;

option go_package = "github.com/elip/WeaveLens/proto/common";

message Resource {
  string id = 1;
  string arn = 2;
  string account_id = 3;
  string region = 4;
  string type = 5;
  string category = 6;
  string name = 7;
  map<string, string> metadata = 8;
}

message Relationship {
  string id = 1;
  string source_id = 2;
  string target_id = 3;
  string type = 4;
  map<string, string> metadata = 5;
}

enum ResourceCategory {
  RESOURCE_CATEGORY_UNSPECIFIED = 0;
  RESOURCE_CATEGORY_COMPUTE = 1;
  RESOURCE_CATEGORY_NETWORK = 2;
  RESOURCE_CATEGORY_DATABASE = 3;
  RESOURCE_CATEGORY_STORAGE = 4;
  RESOURCE_CATEGORY_SECURITY = 5;
  RESOURCE_CATEGORY_INTEGRATION = 6;
  RESOURCE_CATEGORY_OTHER = 7;
}

enum RelationshipType {
  RELATIONSHIP_TYPE_UNSPECIFIED = 0;
  RELATIONSHIP_TYPE_CONTAINS = 1;
  RELATIONSHIP_TYPE_BELONGS_TO = 2;
  RELATIONSHIP_TYPE_CONNECTS_TO = 3;
  RELATIONSHIP_TYPE_ROUTES_TO = 4;
  RELATIONSHIP_TYPE_TARGETS = 5;
  RELATIONSHIP_TYPE_DEPENDS_ON = 6;
  RELATIONSHIP_TYPE_ASSOCIATED_WITH = 7;
}
