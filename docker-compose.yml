name: weavelens

services:
  nats:
    image: nats:2.10-alpine
    container_name: weavelens-nats
    command: ["-js"]
    ports:
      - "4222:4222"
    restart: unless-stopped

  backend:
    image: weavelens/backend:latest
    container_name: weavelens-backend
    depends_on:
      nats:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      - "SERVER_PORT=8080"
      - "NATS_URL=nats://nats:4222"
      - "WEAVELENS_HISTORY_FILE=/app/data/.scans.json"
      - "AWS_REGION=us-east-1"
      - "ENV=production"
      - "LOG_LEVEL=info"
    volumes:
      - ./scans:/app/data
    restart: unless-stopped

  frontend:
    image: weavelens/frontend:latest
    container_name: weavelens-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:8080"
    restart: unless-stopped
